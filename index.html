<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prianshu Mitra — Software Engineer & Founder | Editorial Workspace</title>
    <meta name="description" content="Portfolio of Prianshu Mitra — Software engineer, founder of Debi-Dorshon, and computer science student." />
    
    <!-- Google Fonts: Cormorant Garamond (Editorial Serif), Plus Jakarta Sans (Clean UI), JetBrains Mono (Specs) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS with Exact Palette System -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              paper: '#F0E8D8',
              paperDark: '#E8DDC7',
              primaryText: '#171710',
              workspaceBg: '#15180F',
              secondaryDarkGreen: '#22251A',
              ochre: '#D99A19',
              mutedGreen: '#68713D',
              darkGrey: '#39382F',
              secondaryText: '#5F5B50',
              lightText: '#EEE8D9'
            },
            fontFamily: {
              serif: ['Cormorant Garamond', 'Playfair Display', 'Newsreader', 'Georgia', 'serif'],
              sans: ['Plus Jakarta Sans', 'system-ui', '-apple-system', 'sans-serif'],
              mono: ['Cormorant Garamond', 'Playfair Display', 'Newsreader', 'Georgia', 'serif'],
              display: ['Cormorant Garamond', 'Playfair Display', 'Newsreader', 'Georgia', 'serif']
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#15180F] text-[#EEE8D9] antialiased selection:bg-[#D99A19]/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
